<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <title>Rate Limiter HLD - Gateway + Redis cluster</title>
  <desc>High-level architecture: client, API gateway with rules, Zookeeper config, microservices, Redis cluster x20.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10 0 L0 4 L10 8" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d6d3d1" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="920" height="620" fill="#faf9f6"/>
  <rect width="920" height="620" fill="url(#grid)" opacity="0.15"/>

  <text x="40" y="36" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" font-weight="700" fill="#1c1917">Rate Limiter - High Level Design</text>
  <text x="40" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">1M rps | 100M DAU | availability &gt; consistency | check &lt; 10ms</text>

  <g font-family="Segoe Print, Comic Sans MS, cursive" font-size="13" fill="#44403c">
    <text x="520" y="88">1. Where should the rate limiter live?</text>
    <text x="520" y="108">2. How should we identify clients?</text>
    <text x="520" y="128" font-family="ui-sans-serif" font-size="11" fill="#78716c">(userId | IP | API key)</text>
  </g>

  <rect x="48" y="200" width="120" height="72" rx="6" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="108" y="244" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="16" font-weight="600" fill="#1c1917">Client</text>

  <rect x="280" y="160" width="200" height="200" rx="8" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <text x="380" y="196" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#1c1917">Gateway</text>
  <rect x="310" y="210" width="140" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="244" text-anchor="middle" font-family="ui-sans-serif" font-size="14" font-weight="600" fill="#1e40af">rules</text>
  <text x="380" y="318" text-anchor="middle" font-family="ui-sans-serif" font-size="11" fill="#57534e">allow(key) check</text>
  <text x="380" y="336" text-anchor="middle" font-family="ui-sans-serif" font-size="10" fill="#78716c">fail open / fail closed</text>

  <line x1="168" y1="228" x2="278" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="278" y1="248" x2="168" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrowBack)"/>
  <text x="223" y="220" text-anchor="middle" font-family="ui-sans-serif" font-size="11" fill="#57534e">request</text>
  <rect x="200" y="252" width="48" height="22" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="224" y="268" text-anchor="middle" font-family="ui-monospace" font-size="12" font-weight="700" fill="#991b1b">429</text>

  <ellipse cx="380" cy="108" rx="88" ry="36" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="104" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13" font-weight="600">Zookeeper</text>
  <text x="380" y="120" text-anchor="middle" font-family="ui-sans-serif" font-size="10" fill="#57534e">(etcd)</text>
  <text x="480" y="100" font-family="ui-sans-serif" font-size="12" fill="#44403c">rules</text>
  <line x1="380" y1="144" x2="380" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="158" x2="400" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBack)"/>
  <text x="430" y="152" font-family="ui-sans-serif" font-size="10" fill="#78716c">watch for changes</text>

  <g font-family="Segoe Print, Comic Sans MS, cursive">
    <rect x="560" y="180" width="140" height="44" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="630" y="208" text-anchor="middle" font-size="13">Microservice 1</text>
    <rect x="560" y="238" width="140" height="44" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="630" y="266" text-anchor="middle" font-size="13">Microservice 2</text>
    <rect x="560" y="296" width="140" height="44" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="630" y="324" text-anchor="middle" font-size="13">Microservice 3</text>
  </g>
  <line x1="480" y1="202" x2="558" y2="202" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="260" x2="558" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="318" x2="558" y2="318" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="520" y="350" font-family="ui-sans-serif" font-size="10" fill="#78716c">if allowed</text>

  <g transform="translate(300, 400)">
    <rect x="0" y="24" width="160" height="48" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="16" width="160" height="48" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="16" y="8" width="160" height="48" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="0" width="160" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="104" y="30" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="14" font-weight="700">Redis</text>
  </g>
  <text x="500" y="430" font-family="Segoe Print, Comic Sans MS, cursive" font-size="14" fill="#44403c">x 20</text>
  <text x="500" y="452" font-family="ui-sans-serif" font-size="11" fill="#57534e">50k rps each</text>
  <text x="500" y="470" font-family="ui-monospace" font-size="11" fill="#78716c">1M / 50k = 20 shards</text>

  <line x1="380" y1="360" x2="380" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="398" x2="400" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrowBack)"/>
  <text x="440" y="382" font-family="ui-sans-serif" font-size="10" fill="#78716c">Lua EVAL</text>
  <text x="280" y="382" font-family="ui-sans-serif" font-size="10" fill="#78716c">atomic check</text>

  <rect x="560" y="420" width="160" height="56" rx="4" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="640" y="446" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">Redis</text>
  <text x="640" y="464" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">Replica</text>
  <line x1="484" y1="440" x2="558" y2="448" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="520" y="492" font-family="ui-sans-serif" font-size="10" fill="#78716c">async replication</text>

  <rect x="48" y="480" width="220" height="108" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="64" y="506" font-family="ui-sans-serif" font-size="11" font-weight="700" fill="#44403c">Scale assumptions</text>
  <text x="64" y="528" font-family="ui-sans-serif" font-size="11" fill="#57534e">100M DAU</text>
  <text x="64" y="546" font-family="ui-sans-serif" font-size="11" fill="#57534e">1M requests / second</text>
  <text x="64" y="564" font-family="ui-sans-serif" font-size="11" fill="#57534e">Availability &gt;&gt; consistency</text>
  <text x="64" y="582" font-family="ui-sans-serif" font-size="11" fill="#57534e">Check latency &lt; 10 ms</text>

  <rect x="48" y="380" width="220" height="84" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="64" y="404" font-family="ui-sans-serif" font-size="11" font-weight="700" fill="#44403c">System interface</text>
  <text x="64" y="424" font-family="ui-monospace" font-size="9" fill="#57534e">isRequestAllowed(clientId,</text>
  <text x="64" y="438" font-family="ui-monospace" font-size="9" fill="#57534e">  rulesId) -&gt; { passes,</text>
  <text x="64" y="452" font-family="ui-monospace" font-size="9" fill="#57534e">  remaining, resetTime }</text>

  <circle r="5" fill="#60a5fa" opacity="0">
    <animate attributeName="cx" values="170;270;270" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="228;228;228" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#f87171" opacity="0">
    <animate attributeName="cx" values="270;170;170" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="248;248;248" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#fbbf24" opacity="0">
    <animate attributeName="cx" values="380;380;380" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="362;395;395" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
